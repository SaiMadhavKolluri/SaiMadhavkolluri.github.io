<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) { }

    // model-viewer renders at window.devicePixelRatio. Pin it to 2 before model-viewer loads:
    // 1x screens get 2x supersampling (smooth edges on top of MSAA), 3x phones render
    // 2.25x fewer pixels (steadier 60 fps, still smooth with MSAA).
    try { Object.defineProperty(window, 'devicePixelRatio', { get: () => 2, configurable: true }); } catch (e) { }
  </script>
  <title>MASSBOX® - Exum Instruments | 3D Model Viewer</title>
  <meta name="description"
    content="Explore the MASSBOX® by Exum Instruments in interactive 3D. Rotate, zoom, and view in AR.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <meta property="og:title" content="MASSBOX® by Exum Instruments">
  <meta property="og:description" content="Explore the MASSBOX® in interactive 3D. Rotate, zoom, and view it in your space.">
  <meta property="og:image" content="https://saimadhavkolluri.github.io/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link type="text/css" href="./styles.css" rel="stylesheet" />
  <!-- Start the big downloads right away instead of after model-viewer boots. -->
  <link rel="preload" href="Mass.glb" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="studio_dark.hdr" as="fetch" crossorigin="anonymous">
  <link rel="icon" type="image/png" href="exum_logo.png">
</head>

<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <img src="exum_logo.png" alt="Exum Instruments" class="loading-logo">
    <div class="loading-track"><div class="loading-fill"></div></div>
    <p class="loading-text">Loading 3D model</p>
  </div>

  <!-- Header -->
  <header id="site-header">
    <img class="exum" src="exum_logo.png" alt="Exum Instruments">
    <span class="divider"></span>
    <img class="product" src="massbox_logo.png" alt="MASSBOX®">
  </header>

  <model-viewer id="massbox" src="Mass.glb" ios-src="Mass.usdz" poster="poster.webp" alt="MASSBOX® benchtop mass spectrometer"
    ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
    camera-controls auto-rotate
    camera-orbit="30deg 75deg 105%" max-camera-orbit="auto 95deg auto"
    environment-image="studio_dark.hdr" tone-mapping="neutral" exposure="1.0" shadow-intensity="1" shadow-softness="1">

    <!-- Dimension endpoints (metres). Model is centred on X/Z with its base at Y=0:
         X ±0.528, Y 0..0.588, Z ±0.354. Lines sit 3.5 cm outside the front-left-bottom corner. -->
    <div class="dim-point" slot="hotspot-dim-x-1" data-position="-0.528 0 0.389" data-normal="0 0 1"></div>
    <div class="dim-point" slot="hotspot-dim-x-2" data-position="0.528 0 0.389" data-normal="0 0 1"></div>
    <div class="dim-point" slot="hotspot-dim-y-1" data-position="-0.563 0 0.389" data-normal="-0.707 0 0.707"></div>
    <div class="dim-point" slot="hotspot-dim-y-2" data-position="-0.563 0.588 0.389" data-normal="-0.707 0 0.707"></div>
    <div class="dim-point" slot="hotspot-dim-z-1" data-position="0.563 0 -0.354" data-normal="1 0 0"></div>
    <div class="dim-point" slot="hotspot-dim-z-2" data-position="0.563 0 0.354" data-normal="1 0 0"></div>

    <div id="dim-overlay" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg">
        <g id="dim-x" class="dim-axis"><line class="dim-line" /><line class="dim-tick" /><line class="dim-tick" /></g>
        <g id="dim-y" class="dim-axis"><line class="dim-line" /><line class="dim-tick" /><line class="dim-tick" /></g>
        <g id="dim-z" class="dim-axis"><line class="dim-line" /><line class="dim-tick" /><line class="dim-tick" /></g>
      </svg>
      <span class="dim-label" id="dim-width" data-axis="x">41.5 in</span>
      <span class="dim-label" id="dim-height" data-axis="y">23.2 in</span>
      <span class="dim-label" id="dim-depth" data-axis="z">26.8 in</span>
    </div>

    <!-- Empty slot hides model-viewer's default bar; the loading screen shows progress. -->
    <div slot="progress-bar"></div>

    <button slot="ar-button" id="ar-button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
        <path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" />
      </svg>
      View in your space
    </button>
    <div id="ar-prompt">
      <img src="ar_hand_prompt.png" alt="">
    </div>
  </model-viewer>

  <!-- Toolbar -->
  <nav id="toolbar" aria-label="Viewer controls">
    <button id="share-btn" class="tool" aria-label="Share" data-tip="Share">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><path d="M16 6l-4-4-4 4" /><path d="M12 2v13" />
      </svg>
    </button>
    <div class="tool-wrap">
      <div id="unit-toggle" role="group" aria-label="Units">
        <button data-unit="in" class="active" aria-pressed="true">in</button>
        <button data-unit="cm" aria-pressed="false">cm</button>
      </div>
      <button id="dim-toggle" class="tool" aria-label="Dimensions" aria-pressed="false" data-tip="Dimensions">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z" />
          <path d="m14.5 12.5 2-2" /><path d="m11.5 9.5 2-2" /><path d="m8.5 6.5 2-2" /><path d="m17.5 15.5 2-2" />
        </svg>
      </button>
    </div>
    <button id="banana-btn" class="tool" aria-label="Banana for scale" aria-pressed="false" data-tip="Banana for scale">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 13c3.5-2 8-2 10 2a5.5 5.5 0 0 1 8 5" />
        <path d="M5.15 17.89c5.52-1.52 8.65-6.89 7-12C11.55 4 11.5 2 13 2c3.22 0 5 5.5 5 8 0 6.5-4.2 12-10.49 12C5.11 22 2 22 2 20c0-1.5 1.14-1.55 3.15-2.11Z" />
      </svg>
    </button>
    <span class="tool-sep"></span>
    <button id="rotate-btn" class="tool" aria-label="Auto-rotate" aria-pressed="true" data-tip="Stop rotation">
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" />
      </svg>
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 4.5v15l12-7.5z" />
      </svg>
    </button>
    <button id="theme-btn" class="tool" aria-label="Switch theme" data-tip="Light mode">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>
    <button id="reset-btn" class="tool" aria-label="Reset view" data-tip="Reset view">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" />
      </svg>
    </button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <script type="module" src="script.js"></script>
</body>

</html>
